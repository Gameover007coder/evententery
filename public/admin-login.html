<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Admin Login - Event Scanner</title>
  <meta name="description" content="Admin login to access the QR event scanner and attendee manager." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --error: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 12px;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 22px;
      padding: 30px 24px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
      color: #cbd5e1;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap input {
      width: 100%;
      padding: 13px 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .input-wrap input:focus {
      border-color: #6366f1;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .toggle-pass {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }

    .btn-login {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      box-shadow: 0 6px 22px rgba(99, 102, 241, 0.6);
      transform: translateY(-1px);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .demo-bar {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .btn-demo {
      background: rgba(255, 255, 255, 0.08);
      border: 1px dashed rgba(255, 255, 255, 0.25);
      color: #38bdf8;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-demo:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
    }

    #msg {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    #msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      transition: color 0.2s ease;
    }

    .back-home:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="brand-header">
      <div class="brand-icon">🛡️</div>
      <h1>Admin Scanner Portal</h1>
      <p class="subtitle">Enter your Admin ID & password to continue</p>
    </div>

    <div class="card">
      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="adminId">Admin ID or Email</label>
          <div class="input-wrap">
            <input
              type="text"
              id="adminId"
              name="adminId"
              placeholder="e.g. admin or admin@example.com"
              required
              autocapitalize="none"
              autocorrect="off"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter admin password"
              required
            />
            <button type="button" class="toggle-pass" id="togglePassBtn" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="submitBtn">
          <span>Log In & Open Scanner</span>
          <span>→</span>
        </button>
      </form>

      <div id="msg"></div>

      <div class="demo-bar">
        <button type="button" class="btn-demo" id="autoFillBtn">
          ⚡ Autofill: admin / admin123
        </button>
      </div>
    </div>

    <a href="/" class="back-home">← Back to Event Homepage</a>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const adminIdInput = document.getElementById('adminId');
    const passInput = document.getElementById('password');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');
    const autoFillBtn = document.getElementById('autoFillBtn');
    const togglePassBtn = document.getElementById('togglePassBtn');

    // Auto-fill demo button
    autoFillBtn.addEventListener('click', () => {
      adminIdInput.value = 'admin';
      passInput.value = 'admin123';
      msg.style.display = 'none';
      adminIdInput.focus();
    });

    // Toggle password reveal
    togglePassBtn.addEventListener('click', () => {
      if (passInput.type === 'password') {
        passInput.type = 'text';
        togglePassBtn.textContent = '🔒';
      } else {
        passInput.type = 'password';
        togglePassBtn.textContent = '👁️';
      }
    });

    // Check if already logged in
    (async () => {
      const savedToken = localStorage.getItem('adminToken');
      const headers = savedToken ? { 'Authorization': `Bearer ${savedToken}` } : {};
      try {
        const res = await fetch('/api/admin/me', { credentials: 'include', headers });
        if (res.ok) {
          window.location.replace('/scanner.html');
        }
      } catch (err) {}
    })();

    // Handle login submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = '';
      msg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Verifying...</span>';

      const idOrEmail = adminIdInput.value.trim();
      const password = passInput.value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ idOrEmail, password }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed. Check your ID and password.');

        // Save token to localStorage for mobile persistence
        if (data.token) {
          localStorage.setItem('adminToken', data.token);
        }

        window.location.href = '/scanner.html';
      } catch (err) {
        msg.className = 'error';
        msg.textContent = err.message;
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Log In & Open Scanner</span><span>→</span>';
      }
    });
  </script>
</body>
</html>
