<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Pass Registration</title>
  <meta name="description" content="Register to receive your official QR code entry pass for the event." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .header-box {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-box h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-box p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    input:focus {
      border-color: var(--primary);
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .btn-submit {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Digital Pass Display */
    .pass-container {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .ticket-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .ticket-header {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      padding: 20px;
      text-align: center;
      color: #ffffff;
    }

    .ticket-header h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      margin-bottom: 4px;
    }

    .ticket-header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .ticket-body {
      padding: 24px;
      text-align: center;
    }

    .qr-frame {
      background: #ffffff;
      padding: 14px;
      border-radius: 16px;
      display: inline-block;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .qr-frame img {
      width: 200px;
      height: 200px;
      display: block;
    }

    .ticket-name {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .ticket-email {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .ticket-meta {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      color: #cbd5e1;
      margin-bottom: 18px;
    }

    .ticket-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-download {
      display: block;
      width: 100%;
      padding: 12px;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      border-radius: 10px;
      text-align: center;
      transition: background 0.2s ease;
    }

    .btn-download:hover {
      background: #7dd3fc;
    }

    .btn-reset {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-muted);
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-reset:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
    }

    #errorMsg {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
    }

    .back-home:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-box">
      <h1 id="regEventTitle">Event Registration</h1>
      <p id="regEventSubtitle">Fill out your details to get your official entry pass</p>
    </div>

    <!-- Registration Form Card -->
    <div class="card" id="formCard">
      <form id="regForm">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" required placeholder="John Doe" autocomplete="name" />
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" required placeholder="john@example.com" autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number (Optional)</label>
          <input type="tel" id="phone" placeholder="+1 234 567 8900" autocomplete="tel" />
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">
          <span>Get Entry Pass</span>
        </button>
      </form>

      <div id="errorMsg"></div>
    </div>

    <!-- Generated Digital Ticket Card -->
    <div class="pass-container" id="passContainer">
      <div class="ticket-card">
        <div class="ticket-header">
          <h2 id="ticketEventName">Event Pass</h2>
          <p id="ticketEventDetails">Official Entry Credential</p>
        </div>
        <div class="ticket-body">
          <div class="qr-frame">
            <img id="ticketQrImage" src="" alt="Visitor QR Code" />
          </div>
          <div class="ticket-name" id="ticketVisitorName">Attendee Name</div>
          <div class="ticket-email" id="ticketVisitorEmail">email@example.com</div>

          <div class="ticket-meta">
            <span>Pass Code:</span>
            <strong id="ticketTokenCode" style="font-family: monospace;">pass_12345</strong>
          </div>

          <div class="ticket-actions">
            <a id="downloadPassBtn" href="#" download="event-pass.png" class="btn-download">
              💾 Save / Download Pass
            </a>
            <button type="button" class="btn-reset" id="btnRegisterAnother">
              Register Another Visitor
            </button>
          </div>
        </div>
      </div>
    </div>

    <a href="/" class="back-home">← Back to Event Homepage</a>
  </div>

  <script>
    // Load event info
    (async () => {
      try {
        const res = await fetch('/api/info');
        const data = await res.json();
        if (data.event) {
          if (data.event.name) {
            document.getElementById('regEventTitle').textContent = data.event.name;
            document.getElementById('ticketEventName').textContent = data.event.name;
          }
          if (data.event.venue || data.event.date) {
            const subtitle = `${data.event.date || ''} &bull; ${data.event.venue || ''}`;
            document.getElementById('ticketEventDetails').innerHTML = subtitle;
          }
        }
      } catch (err) {}
    })();

    const form = document.getElementById('regForm');
    const formCard = document.getElementById('formCard');
    const passContainer = document.getElementById('passContainer');
    const errorMsg = document.getElementById('errorMsg');
    const btnSubmit = document.getElementById('btnSubmit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Generating Pass...';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();

      try {
        const res = await fetch('/api/visitors/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed');

        // Show ticket
        document.getElementById('ticketVisitorName').textContent = data.visitor.name;
        document.getElementById('ticketVisitorEmail').textContent = data.visitor.email;
        document.getElementById('ticketTokenCode').textContent = data.visitor.qrToken;
        document.getElementById('ticketQrImage').src = data.qrCodeDataUrl;

        const dlBtn = document.getElementById('downloadPassBtn');
        dlBtn.href = data.qrCodeDataUrl;
        dlBtn.download = `Pass_${data.visitor.name.replace(/\s+/g, '_')}.png`;

        formCard.style.display = 'none';
        passContainer.style.display = 'block';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Get Entry Pass';
      }
    });

    document.getElementById('btnRegisterAnother').addEventListener('click', () => {
      form.reset();
      passContainer.style.display = 'none';
      formCard.style.display = 'block';
    });
  </script>
</body>
</html>
