<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Admin Event Scanner</title>
  <meta name="description" content="Mobile admin QR scanner and attendee management for real-time event check-ins." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- HTML5 QR Code Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 30px;
    }

    /* Top App Bar */
    .app-header {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .header-titles h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
    }

    .header-titles .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #34d399;
      font-weight: 600;
    }

    .header-titles .status-dot {
      width: 6px;
      height: 6px;
      background: #34d399;
      border-radius: 50%;
      box-shadow: 0 0 6px #34d399;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 16px;
      flex-grow: 1;
    }

    /* Stats Overview */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
    }

    .stat-num {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 2px;
    }

    .stat-num.total { color: #f8fafc; }
    .stat-num.checked { color: #34d399; }
    .stat-num.pending { color: #fbbf24; }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Tab switcher */
    .nav-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 10px 8px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .tab-pane {
      display: none;
    }

    .tab-pane.active {
      display: block;
    }

    /* Scanner View */
    .scanner-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      position: relative;
    }

    #reader {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
    }

    #reader video {
      border-radius: 14px;
      object-fit: cover;
    }

    .scanner-controls {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
    }

    .scanner-controls button, .scanner-controls label {
      flex: 1;
      padding: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .scanner-controls button:hover, .scanner-controls label:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    /* Result Banner */
    .result-card {
      display: none;
      padding: 18px;
      border-radius: 16px;
      margin-top: 16px;
      animation: slideDown 0.25s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-card.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1.5px solid #10b981;
    }

    .result-card.warning {
      display: block;
      background: rgba(245, 158, 11, 0.15);
      border: 1.5px solid #f59e0b;
    }

    .result-card.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1.5px solid #ef4444;
    }

    .result-title {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-card.success .result-title { color: #34d399; }
    .result-card.warning .result-title { color: #fbbf24; }
    .result-card.error .result-title { color: #f87171; }

    .result-meta {
      font-size: 14px;
      line-height: 1.5;
      color: #e2e8f0;
      margin-bottom: 14px;
    }

    .btn-scan-next {
      width: 100%;
      padding: 12px;
      background: #ffffff;
      color: #0f172a;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Manual Check-in & Search */
    .search-box {
      margin-bottom: 14px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px 12px 38px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--text-muted);
    }

    /* Attendees List */
    .roster-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .roster-header h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
    }

    .btn-add-visitor {
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .attendee-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .attendee-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .attendee-info h4 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .attendee-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .attendee-status {
      margin-top: 4px;
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .attendee-status.checked {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .attendee-status.pending {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .attendee-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
    }

    .btn-action-checkin {
      background: var(--success);
      color: #ffffff;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-action-reset {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .modal-card h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      margin-bottom: 16px;
    }

    .modal-form .form-group {
      margin-bottom: 14px;
    }

    .modal-form label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 4px;
    }

    .modal-form input {
      width: 100%;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .modal-btn-group {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-btn-group button {
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
    }

    .btn-save {
      background: var(--primary);
      border: none;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <!-- App Header -->
  <header class="app-header">
    <div class="header-info">
      <div class="header-logo">🛡️</div>
      <div class="header-titles">
        <h1 id="eventHeaderName">Event Scanner</h1>
        <div class="status-pill">
          <span class="status-dot"></span>
          <span id="adminBadgeText">Admin Active</span>
        </div>
      </div>
    </div>
    <button class="btn-logout" id="logoutBtn" title="Log out">Log out</button>
  </header>

  <div class="container">
    <!-- Live Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num total" id="statTotal">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-card">
        <div class="stat-num checked" id="statChecked">0</div>
        <div class="stat-label">Checked In</div>
      </div>
      <div class="stat-card">
        <div class="stat-num pending" id="statPending">0</div>
        <div class="stat-label">Pending</div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="tab-btn active" data-tab="tab-scanner" id="btnTabScanner">
        <span>📸 Camera Scan</span>
      </button>
      <button class="tab-btn" data-tab="tab-attendees" id="btnTabAttendees">
        <span>👥 Attendees List</span>
      </button>
    </div>

    <!-- TAB 1: SCANNER -->
    <div class="tab-pane active" id="tab-scanner">
      <div class="scanner-box">
        <div id="reader"></div>

        <!-- Scanner controls -->
        <div class="scanner-controls">
          <button id="btnSwitchCamera" type="button">🔄 Switch Camera</button>
          <label for="qrFileInput" id="lblQrFile">
            📁 Scan Photo
            <input type="file" id="qrFileInput" accept="image/*" style="display: none;" />
          </label>
        </div>

        <!-- Result Card -->
        <div id="resultCard" class="result-card">
          <div class="result-title" id="resultTitle">Verified</div>
          <div class="result-meta" id="resultMeta">Attendee details</div>
          <button class="btn-scan-next" id="btnScanNext">⚡ Scan Next Pass</button>
        </div>
      </div>
    </div>

    <!-- TAB 2: ATTENDEES & MANUAL CHECK-IN -->
    <div class="tab-pane" id="tab-attendees">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="Search by name, email, or pass ID..." />
      </div>

      <div class="roster-header">
        <h3 id="rosterCountTitle">Attendees (0)</h3>
        <button class="btn-add-visitor" id="btnOpenAddModal">➕ Add Attendee</button>
      </div>

      <div class="attendee-list" id="attendeeList">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Add Attendee Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-card">
      <h3>Add New Attendee</h3>
      <form class="modal-form" id="addAttendeeForm">
        <div class="form-group">
          <label for="newName">Full Name</label>
          <input type="text" id="newName" required placeholder="Jane Doe" />
        </div>
        <div class="form-group">
          <label for="newEmail">Email Address</label>
          <input type="email" id="newEmail" required placeholder="jane@example.com" />
        </div>
        <div class="form-group">
          <label for="newPhone">Phone (Optional)</label>
          <input type="tel" id="newPhone" placeholder="+1 234 567 890" />
        </div>
        <div class="modal-btn-group">
          <button type="button" class="btn-cancel" id="btnCloseModal">Cancel</button>
          <button type="submit" class="btn-save">Create Pass</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Audio Feedback Generator using Web Audio API (zero audio file dependencies)
    class AudioEffects {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }
      success() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, this.ctx.currentTime); // A5
          osc.frequency.exponentialRampToValueAtTime(1320, this.ctx.currentTime + 0.15); // E6
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.25);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.25);
        } catch (e) {}
      }
      warning() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, this.ctx.currentTime);
          osc.frequency.setValueAtTime(220, this.ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.25);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.25);
        } catch (e) {}
      }
      error() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.3);
        } catch (e) {}
      }
    }

    const sound = new AudioEffects();

    // Global state
    let token = localStorage.getItem('adminToken') || '';
    let visitorsList = [];
    let html5QrCode = null;
    let isProcessing = false;
    let currentFacingMode = 'environment'; // default to rear camera

    // Helper: Auth headers
    function getHeaders(custom = {}) {
      const headers = { 'Content-Type': 'application/json', ...custom };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      return headers;
    }

    // Check Authentication
    async function checkAuth() {
      try {
        const res = await fetch('/api/admin/me', {
          credentials: 'include',
          headers: getHeaders(),
        });
        if (!res.ok) {
          localStorage.removeItem('adminToken');
          window.location.href = '/admin-login.html';
          return;
        }
        const data = await res.json();
        if (data.event && data.event.name) {
          document.getElementById('eventHeaderName').textContent = data.event.name;
        }
        if (data.admin) {
          document.getElementById('adminBadgeText').textContent = data.admin.id || 'Admin';
        }
      } catch (err) {
        window.location.href = '/admin-login.html';
      }
    }

    // Tab Navigation
    const tabButtons = document.querySelectorAll('.tab-btn');
    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        tabButtons.forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'tab-attendees') {
          fetchVisitors();
        }
      });
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/admin/logout', { method: 'POST', credentials: 'include', headers: getHeaders() });
      localStorage.removeItem('adminToken');
      window.location.href = '/admin-login.html';
    });

    // Scanner UI elements
    const resultCard = document.getElementById('resultCard');
    const resultTitle = document.getElementById('resultTitle');
    const resultMeta = document.getElementById('resultMeta');
    const btnScanNext = document.getElementById('btnScanNext');

    function showScanResult(type, title, meta) {
      resultCard.className = 'result-card ' + type;
      resultTitle.innerHTML = title;
      resultMeta.innerHTML = meta;

      // Haptic and audio feedback
      if (type === 'success') {
        sound.success();
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      } else if (type === 'warning') {
        sound.warning();
        if (navigator.vibrate) navigator.vibrate([300]);
      } else {
        sound.error();
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      }
    }

    // Process Check-in
    async function processCheckin(qrToken) {
      if (isProcessing) return;
      isProcessing = true;

      try {
        if (html5QrCode && html5QrCode.isScanning) {
          await html5QrCode.pause(true);
        }

        const res = await fetch('/api/admin/checkin', {
          method: 'POST',
          headers: getHeaders(),
          credentials: 'include',
          body: JSON.stringify({ token: qrToken }),
        });

        const data = await res.json();

        if (res.ok && data.success) {
          const v = data.visitor;
          showScanResult(
            'success',
            '✅ Verified: ' + v.name,
            `<strong>${v.email}</strong><br>Checked in at ${new Date(v.checkedInAt).toLocaleTimeString()} by ${v.checkedInBy || 'Admin'}`
          );
          fetchVisitors();
        } else if (res.status === 409) {
          const v = data.visitor;
          const checkTime = v.checkedInAt ? new Date(v.checkedInAt).toLocaleTimeString() : 'earlier';
          showScanResult(
            'warning',
            '⚠️ Already Checked In!',
            `<strong>${v.name}</strong> (${v.email}) was already checked in at ${checkTime}.`
          );
        } else {
          showScanResult(
            'error',
            '❌ Invalid Pass',
            data.error || 'This QR pass was not recognized or has expired.'
          );
        }
      } catch (err) {
        showScanResult('error', '⚠️ Network Error', 'Could not reach server. Please check your connection.');
      }
    }

    // Next pass button
    btnScanNext.addEventListener('click', async () => {
      resultCard.className = 'result-card';
      isProcessing = false;
      if (html5QrCode) {
        try {
          await html5QrCode.resume();
        } catch (e) {}
      }
    });

    // Start Camera Scanner
    function startCamera() {
      html5QrCode = new Html5Qrcode('reader');
      const config = {
        fps: 12,
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0,
      };

      html5QrCode.start(
        { facingMode: currentFacingMode },
        config,
        (decodedText) => {
          processCheckin(decodedText);
        },
        () => {} // silent on frame without QR
      ).catch(err => {
        console.warn('Camera start error:', err);
        resultCard.className = 'result-card warning';
        resultTitle.innerHTML = '📷 Camera Access Note';
        resultMeta.innerHTML = 'Could not start live camera feed. (Mobile browsers require HTTPS for live camera, or use the <strong>Scan Photo</strong> button below to snap a picture of the QR code!).';
      });
    }

    // Switch Camera (rear/front)
    document.getElementById('btnSwitchCamera').addEventListener('click', async () => {
      if (!html5QrCode) return;
      try {
        await html5QrCode.stop();
        currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
        startCamera();
      } catch (e) {
        console.warn('Camera switch error:', e);
      }
    });

    // Scan from Photo / Gallery File
    const qrFileInput = document.getElementById('qrFileInput');
    qrFileInput.addEventListener('change', async (e) => {
      if (!e.target.files || e.target.files.length === 0) return;
      const file = e.target.files[0];
      try {
        const scanner = new Html5Qrcode('reader');
        const decodedText = await scanner.scanFile(file, true);
        processCheckin(decodedText);
      } catch (err) {
        showScanResult('error', '❌ Could not read QR', 'No valid QR code found in this photo. Please try a clearer shot.');
      } finally {
        qrFileInput.value = '';
      }
    });

    // Fetch Visitors & Stats
    async function fetchVisitors() {
      try {
        const res = await fetch('/api/admin/visitors', {
          credentials: 'include',
          headers: getHeaders(),
        });
        if (!res.ok) return;
        const data = await res.json();

        visitorsList = data.visitors || [];

        // Update stats
        if (data.stats) {
          document.getElementById('statTotal').textContent = data.stats.total;
          document.getElementById('statChecked').textContent = data.stats.checkedIn;
          document.getElementById('statPending').textContent = data.stats.pending;
        }

        renderAttendees(visitorsList);
      } catch (err) {
        console.warn('Failed to fetch visitors:', err);
      }
    }

    // Render Attendee List
    function renderAttendees(list) {
      const container = document.getElementById('attendeeList');
      document.getElementById('rosterCountTitle').textContent = `Attendees (${list.length})`;

      if (list.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 24px; color: #64748b;">No attendees found.</div>';
        return;
      }

      container.innerHTML = list.map(v => {
        const isChecked = v.status === 'checked_in';
        return `
          <div class="attendee-item">
            <div class="attendee-info">
              <h4>${v.name}</h4>
              <p>${v.email} ${v.phone ? ' &bull; ' + v.phone : ''}</p>
              <span class="attendee-status ${isChecked ? 'checked' : 'pending'}">
                ${isChecked ? '✓ Checked In' : '⏳ Pending'}
              </span>
            </div>
            <div class="attendee-actions">
              ${
                isChecked
                  ? `<button class="btn-action-reset" onclick="resetCheckin('${v.qrToken}')">↺ Reset</button>`
                  : `<button class="btn-action-checkin" onclick="manualCheckin('${v.qrToken}')">Check In</button>`
              }
            </div>
          </div>
        `;
      }).join('');
    }

    // Manual checkin from attendee list
    window.manualCheckin = async (qrToken) => {
      await processCheckin(qrToken);
      fetchVisitors();
    };

    // Reset checkin from attendee list
    window.resetCheckin = async (qrToken) => {
      try {
        const res = await fetch('/api/admin/reset-checkin', {
          method: 'POST',
          headers: getHeaders(),
          credentials: 'include',
          body: JSON.stringify({ token: qrToken }),
        });
        if (res.ok) {
          fetchVisitors();
        }
      } catch (err) {}
    };

    // Search input filter
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        renderAttendees(visitorsList);
        return;
      }
      const filtered = visitorsList.filter(v =>
        v.name.toLowerCase().includes(q) ||
        v.email.toLowerCase().includes(q) ||
        (v.phone && v.phone.includes(q)) ||
        (v.qrToken && v.qrToken.toLowerCase().includes(q))
      );
      renderAttendees(filtered);
    });

    // Add Visitor Modal
    const addModal = document.getElementById('addModal');
    document.getElementById('btnOpenAddModal').addEventListener('click', () => {
      addModal.classList.add('open');
    });
    document.getElementById('btnCloseModal').addEventListener('click', () => {
      addModal.classList.remove('open');
    });

    document.getElementById('addAttendeeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('newName').value.trim();
      const email = document.getElementById('newEmail').value.trim();
      const phone = document.getElementById('newPhone').value.trim();

      try {
        const res = await fetch('/api/admin/add-visitor', {
          method: 'POST',
          headers: getHeaders(),
          credentials: 'include',
          body: JSON.stringify({ name, email, phone }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to add');

        addModal.classList.remove('open');
        document.getElementById('addAttendeeForm').reset();
        fetchVisitors();
      } catch (err) {
        alert(err.message);
      }
    });

    // Startup
    (async () => {
      await checkAuth();
      fetchVisitors();
      startCamera();
    })();
  </script>
</body>
</html>
