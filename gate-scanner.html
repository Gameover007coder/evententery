<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gate Scanner — EventPass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg-dark: #090d16;
    --bg-surface: #0f172a;
    --bg-card: #131d33;
    --border-color: rgba(255, 255, 255, 0.08);
    --primary: #10b981;
    --primary-hover: #059669;
    --accent: #06b6d4;
    --warning: #f59e0b;
    --danger: #ef4444;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --radius-md: 12px;
    --radius-lg: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: rgba(9, 13, 22, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
  }
  .brand {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    color: #fff;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.05rem;
  }
  .nav-links {
    display: flex;
    gap: 12px;
  }
  .nav-links a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 6px;
    background: rgba(255,255,255,0.04);
    transition: all 0.15s;
  }
  .nav-links a:hover {
    color: #fff;
    background: rgba(255,255,255,0.08);
  }
  .wrap {
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
    padding: 16px 16px 40px;
    flex: 1;
  }
  .panel {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 16px;
  }
  .panel label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text-muted);
  }
  .panel input[type=text], .panel input[type=url], .panel select {
    width: 100%;
    padding: 10px 14px;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    color: #fff;
    font-size: 0.95rem;
    margin-bottom: 14px;
  }
  .panel input:focus, .panel select:focus {
    outline: none;
    border-color: var(--primary);
  }
  button {
    background: var(--primary);
    color: #052e16;
    border: none;
    padding: 12px 18px;
    border-radius: var(--radius-md);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: all 0.2s;
  }
  button:hover { background: var(--primary-hover); color: #fff; }
  button.secondary {
    background: rgba(255,255,255,0.05);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    margin-top: 8px;
  }
  button.secondary:hover { background: rgba(255,255,255,0.1); }
  .hint {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: -8px;
    margin-bottom: 14px;
  }

  /* Scanner */
  #scanner-section { display: none; }
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 10px;
    padding: 0 4px;
  }
  .camera-box {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 380px;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: #000;
    border: 2px solid var(--border-color);
  }
  #reader {
    width: 100% !important;
    height: 100% !important;
  }
  #reader video {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    border-radius: var(--radius-lg);
  }

  /* Targeting Laser */
  .reticle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    pointer-events: none;
  }
  .corner {
    position: absolute;
    width: 24px;
    height: 24px;
    border-color: var(--primary);
    border-style: solid;
  }
  .corner.tl { top: 0; left: 0; border-width: 3px 0 0 3px; border-top-left-radius: 6px; }
  .corner.tr { top: 0; right: 0; border-width: 3px 3px 0 0; border-top-right-radius: 6px; }
  .corner.bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-bottom-left-radius: 6px; }
  .corner.br { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-bottom-right-radius: 6px; }
  .laser {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    box-shadow: 0 0 8px var(--primary);
    animation: laserScan 2s ease-in-out infinite alternate;
  }
  @keyframes laserScan { 0% { top: 10%; } 100% { top: 90%; } }

  #result-panel {
    margin-top: 16px;
    border-radius: var(--radius-md);
    padding: 18px;
    text-align: center;
    display: none;
    animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes popIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  #result-panel.ok { background: rgba(16, 185, 129, 0.18); border: 1px solid var(--primary); color: #34d399; }
  #result-panel.warn { background: rgba(245, 158, 11, 0.18); border: 1px solid var(--warning); color: #fbbf24; }
  #result-panel.err { background: rgba(239, 68, 68, 0.18); border: 1px solid var(--danger); color: #fca5a5; }
  #result-panel .icon { font-size: 2.2rem; line-height: 1; margin-bottom: 6px; }
  #result-panel .title { font-size: 1.15rem; font-weight: 700; margin-bottom: 2px; }
  #result-panel .detail { font-size: 0.88rem; color: #e2e8f0; }

  .manual-entry {
    margin-top: 16px;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 14px 16px;
  }
  .manual-entry .row { display: flex; gap: 8px; }
  .manual-entry input {
    flex: 1;
    padding: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    font-size: 0.95rem;
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
  }
  .manual-entry button { width: auto; padding: 10px 18px; }
  .manual-entry .label { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px; }

  #session-count {
    text-align: center;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 18px;
  }
</style>
</head>
<body>

<header class="header-nav">
  <a href="index.html" class="brand">
    <span>🎫</span> EventPass Scanner
  </a>
  <div class="nav-links">
    <a href="index.html#dashboard">📊 Dashboard</a>
    <a href="index.html#badges">🪪 Badges</a>
  </div>
</header>

<div class="wrap">
  <!-- SETUP -->
  <div class="panel" id="setup-panel">
    <h2 style="font-size:1.15rem; margin-bottom:12px; font-family:'Plus Jakarta Sans',sans-serif;">Gate Scanner Setup</h2>
    
    <label for="script-url">Google Apps Script Web App URL</label>
    <input type="url" id="script-url" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="hint">Leave blank to test in offline Demo Mode. Automatically synchronized with main app.</div>

    <label for="gate-name">Gate Label / Operator Name</label>
    <input type="text" id="gate-name" value="Gate 1 – Main Entry">

    <label for="gate-passcode">Security Passcode (Optional)</label>
    <input type="password" id="gate-passcode" placeholder="Leave blank if none">

    <button onclick="startScanning()">Start Scanner</button>
  </div>

  <!-- SCANNER -->
  <div id="scanner-section">
    <div class="status-bar">
      <span id="gate-label-display" style="font-weight:600; color:#fff;"></span>
      <span id="scan-state" style="color:var(--primary);">Ready</span>
    </div>

    <div class="camera-box">
      <div id="reader"></div>
      <div class="reticle">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="laser"></div>
      </div>
    </div>

    <div style="display:flex; gap:8px; margin-top:10px;">
      <select id="camera-select" onchange="onCameraChange()" style="flex:1; padding:8px; background:var(--bg-card); color:#fff; border:1px solid var(--border-color); border-radius:8px;">
      </select>
      <button class="secondary" style="width:auto; margin-top:0;" onclick="switchCamera()">Switch</button>
    </div>

    <div id="result-panel">
      <div class="icon" id="result-icon"></div>
      <div class="title" id="result-title"></div>
      <div class="detail" id="result-detail"></div>
    </div>

    <div class="manual-entry">
      <div class="label">Keyboard Fallback:</div>
      <div class="row">
        <input type="text" id="manual-id" placeholder="e.g. ATT-7K2P9M" onkeydown="if(event.key==='Enter') submitManual()">
        <button onclick="submitManual()">Check In</button>
      </div>
    </div>

    <div id="session-count">0 check-ins this session</div>
    <button class="secondary" onclick="resetSetup()">Change Settings</button>
  </div>
</div>

<script>
let scriptUrl = localStorage.getItem('eventCheckin_scriptUrl') || '';
let gateName = localStorage.getItem('eventCheckin_gateName') || 'Gate 1 – Main Entry';
let passcode = localStorage.getItem('eventCheckin_passcode') || '';
let html5QrCode = null;
let cameras = [];
let currentCameraIndex = 0;
let isProcessing = false;
let sessionCount = 0;
let resumeTimer = null;
let audioCtx = null;

// Initialize on load
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('script-url').value = scriptUrl;
  document.getElementById('gate-name').value = gateName;
  document.getElementById('gate-passcode').value = passcode;

  // Initialize Web Audio API
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
  } catch (e) {}

  // Auto-start if URL or demo mode already set
  if (scriptUrl || localStorage.getItem('eventCheckin_demoMode') === 'true') {
    startScanning();
  }
});

function playChime(type) {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;

  if (type === 'ok') {
    [1046.50, 1318.51, 1567.98].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(freq, now + i * 0.08);
      gain.gain.setValueAtTime(0.2, now + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + i * 0.08);
      osc.stop(now + i * 0.08 + 0.26);
    });
  } else if (type === 'warn') {
    [440, 440].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + i * 0.12);
      gain.gain.setValueAtTime(0.25, now + i * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + i * 0.12);
      osc.stop(now + i * 0.12 + 0.16);
    });
  } else {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, now);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.31);
  }
}

function startScanning() {
  scriptUrl = document.getElementById('script-url').value.trim();
  gateName = document.getElementById('gate-name').value.trim() || 'Gate 1';
  passcode = document.getElementById('gate-passcode').value.trim();

  localStorage.setItem('eventCheckin_scriptUrl', scriptUrl);
  localStorage.setItem('eventCheckin_gateName', gateName);
  localStorage.setItem('eventCheckin_passcode', passcode);

  document.getElementById('setup-panel').style.display = 'none';
  document.getElementById('scanner-section').style.display = 'block';
  document.getElementById('gate-label-display').textContent = gateName;

  if (!html5QrCode) {
    html5QrCode = new Html5Qrcode('reader');
  }

  Html5Qrcode.getCameras().then(devices => {
    cameras = devices;
    const select = document.getElementById('camera-select');
    select.innerHTML = '';
    devices.forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = d.label || `Camera ${i + 1}`;
      select.appendChild(opt);
    });

    if (devices && devices.length) {
      const backIndex = devices.findIndex(d => /back|rear|environment/i.test(d.label));
      currentCameraIndex = backIndex >= 0 ? backIndex : 0;
      select.value = currentCameraIndex;
      launchCamera(devices[currentCameraIndex].id);
    } else {
      setState('No camera found', true);
    }
  }).catch(() => {
    setState('Camera access denied', true);
  });
}

function launchCamera(cameraId) {
  html5QrCode.start(
    cameraId,
    { fps: 12, qrbox: { width: 220, height: 220 }, aspectRatio: 1.0 },
    onScanSuccess,
    () => {}
  ).then(() => setState('Ready to Scan', false))
   .catch(() => setState('Unable to start camera', true));
}

function switchCamera() {
  if (cameras.length < 2) return;
  currentCameraIndex = (currentCameraIndex + 1) % cameras.length;
  document.getElementById('camera-select').value = currentCameraIndex;
  html5QrCode.stop().then(() => {
    launchCamera(cameras[currentCameraIndex].id);
  });
}

function onCameraChange() {
  currentCameraIndex = parseInt(document.getElementById('camera-select').value, 10);
  html5QrCode.stop().then(() => {
    launchCamera(cameras[currentCameraIndex].id);
  });
}

function setState(text, isError) {
  const el = document.getElementById('scan-state');
  el.textContent = text;
  el.style.color = isError ? 'var(--danger)' : 'var(--primary)';
}

function onScanSuccess(decodedText) {
  if (isProcessing) return;
  processCheckIn(decodedText.trim());
}

function submitManual() {
  const val = document.getElementById('manual-id').value.trim();
  if (!val) return;
  processCheckIn(val.toUpperCase());
  document.getElementById('manual-id').value = '';
}

function processCheckIn(id) {
  if (isProcessing) return;
  isProcessing = true;
  setState('Checking...', false);
  clearTimeout(resumeTimer);

  const cleanId = id.includes('/') ? id.split('/').pop().trim().toUpperCase() : id.trim().toUpperCase();

  // Demo mode fallback if no URL configured
  if (!scriptUrl) {
    setTimeout(() => {
      sessionCount++;
      document.getElementById('session-count').textContent = `${sessionCount} check-in${sessionCount !== 1 ? 's' : ''} this session`;
      showResultRaw('ok', '✅', 'Demo Attendee', `Checked in at ${new Date().toLocaleTimeString()} (Demo Mode)`);
      playChime('ok');
    }, 300);
    return;
  }

  fetch(scriptUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'checkin', id: cleanId, scannedBy: gateName, passcode: passcode })
  })
  .then(res => res.json())
  .then(data => showResult(data))
  .catch(() => {
    showResultRaw('err', '⚠️', 'Connection error', 'Could not reach Google Sheets. Check internet.');
    playChime('err');
  });
}

function showResult(data) {
  if (data.status === 'success') {
    sessionCount++;
    document.getElementById('session-count').textContent = `${sessionCount} check-in${sessionCount !== 1 ? 's' : ''} this session`;
    showResultRaw('ok', '✅', data.name || 'Checked In', data.team ? `Team: ${data.team}` : 'Welcome!');
    playChime('ok');
    if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
  } else if (data.status === 'duplicate') {
    showResultRaw('warn', '⏱️', `${data.name || 'Attendee'} already checked in`, data.timestamp ? `First scanned at ${data.timestamp}` : 'Already recorded');
    playChime('warn');
    if (navigator.vibrate) navigator.vibrate([150, 100, 150]);
  } else if (data.status === 'not_found') {
    showResultRaw('err', '❌', 'Code not recognized', 'ID not found in sheet.');
    playChime('err');
    if (navigator.vibrate) navigator.vibrate([200]);
  } else {
    showResultRaw('err', '⚠️', 'Error', data.message || 'Please try again.');
    playChime('err');
  }
}

function showResultRaw(cls, icon, title, detail) {
  const panel = document.getElementById('result-panel');
  panel.className = cls;
  panel.style.display = 'block';
  document.getElementById('result-icon').textContent = icon;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-detail').textContent = detail;
  setState('Ready to Scan', false);

  resumeTimer = setTimeout(() => {
    panel.style.display = 'none';
    isProcessing = false;
  }, 2200);
}

function resetSetup() {
  if (html5QrCode) {
    html5QrCode.stop().catch(() => {});
  }
  document.getElementById('scanner-section').style.display = 'none';
  document.getElementById('setup-panel').style.display = 'block';
  document.getElementById('result-panel').style.display = 'none';
}
</script>
</body>
</html>
